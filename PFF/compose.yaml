services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mvc_backend
    ports:
      - "5000:8080" 
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - app-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: angular_frontend
    ports:
      - "4200:80" 
    depends_on:
      - backend
    networks:
      - app-net

networks:
  app-net:
    driver: bridge